<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="96" fill="url(#bgGrad)" />

  <!-- S Pharma Logo Core Group -->
  <g transform="translate(0, -10)">
    <!-- Big Bold 'S' -->
    <text 
      x="256" 
      y="320" 
      text-anchor="middle" 
      font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
      font-weight="900" 
      font-size="300" 
      fill="#111827" 
      letter-spacing="-10"
    >S</text>

    <!-- Speed Lines (Trailing to the left) -->
    <g stroke="#38b000" stroke-linecap="round">
      <!-- Line 1 (Top) -->
      <line x1="120" y1="202" x2="295" y2="202" stroke-width="4.5" />
      <!-- Line 2 -->
      <line x1="95" y1="219" x2="295" y2="219" stroke-width="5" />
      <!-- Line 3 -->
      <line x1="105" y1="236" x2="295" y2="236" stroke-width="5" />
      <!-- Line 4 (Bottom) -->
      <line x1="80" y1="253" x2="295" y2="253" stroke-width="4.5" />
    </g>

    <!-- Capsule Pill Flying Right -->
    <g transform="translate(290, 194)">
      <!-- Pill Container (Outer Stroke) -->
      <rect 
        x="0" 
        y="0" 
        width="112" 
        height="64" 
        rx="32" 
        fill="#ffffff" 
        stroke="#38b000" 
        stroke-width="7" 
      />

      <!-- Pill Left Half (Solid Green Fill) -->
      <path 
        d="M 32 0 L 56 0 L 56 64 L 32 64 A 32 32 0 0 1 0 32 A 32 32 0 0 1 32 0 Z" 
        fill="#38b000" 
      />

      <!-- Center Divider Line -->
      <line x1="56" y1="0" x2="56" y2="64" stroke="#38b000" stroke-width="4" />

      <!-- Glossy Curved Reflection Highlight on Left Cap -->
      <path 
        d="M 28 8 A 24 24 0 0 0 8 32 A 24 24 0 0 0 14 46" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="4" 
        stroke-linecap="round" 
        opacity="0.85" 
      />
    </g>

    <!-- Subtitle: "s pharma" with green 'r' -->
    <g transform="translate(256, 420)">
      <text 
        text-anchor="middle" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
        font-weight="800" 
        font-size="64" 
        letter-spacing="-1"
      >
        <tspan fill="#111827">s pha</tspan>
        <tspan fill="#38b000">r</tspan>
        <tspan fill="#111827">ma</tspan>
      </text>
    </g>
  </g>
</svg>
